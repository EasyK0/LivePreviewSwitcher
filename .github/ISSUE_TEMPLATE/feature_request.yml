name: Feature request
description: An idea for the thumbnails, switching or the DPS counter
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Features that send keys or mouse clicks to the game (broadcasting, automation) won't be added; see "Fair play" in the README.
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: What the feature does and when you would use it
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: Workaround or other tool, if any
